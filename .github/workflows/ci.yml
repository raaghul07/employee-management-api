name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: employee_db
          POSTGRES_USER: employee_user
          POSTGRES_PASSWORD: employee_pass
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U employee_user -d employee_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          DB_PASSWORD: employee_pass
          JWT_SECRET: dGVzdC1vbmx5LWtleS1mb3ItY2ktdGVzdHMtMzItYnl0ZXMtbWluaW11bQ==
        run: bash ./mvnw clean test
